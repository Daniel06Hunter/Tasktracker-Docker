name: CI Pipeline

# Триггер: когда мы отправляем код в ветку dev
on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    # На каком виртуальном компьютере запускать проверку
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем текущую версию кода из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем Python нужной версии
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Устанавливаем зависимости из requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi